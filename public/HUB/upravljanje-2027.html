<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CARNET Hub · Godišnji planer 2027 / Annual Planner 2027</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#1c2330;background:#edf0f4}
.wrap{max-width:1340px;margin:0 auto;padding:20px 20px 48px}

/* ── Header ── */
h1{font-size:26px;margin:0;font-weight:800;letter-spacing:-.3px}
.sub{color:#5b6472;font-size:14px;margin-top:4px;line-height:1.5}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:14px 0 4px;padding-bottom:14px;border-bottom:2px solid #dde0e6}
.bar .sp{flex:1}
button{font:inherit;font-size:14px;padding:8px 16px;border-radius:8px;border:1px solid #c5cad3;background:#fff;cursor:pointer;transition:background .12s,border-color .12s}
button:hover{background:#f0f2f5;border-color:#9ba3b0}
button.pri{background:#1f3a8a;color:#fff;border-color:#1f3a8a;font-weight:700}
button.pri:hover{background:#172e70}
button.on{background:#1c2330;color:#fff;border-color:#1c2330;font-weight:700}
button:disabled{opacity:.45;cursor:default}

/* ── Panels ── */
.gov{background:#fff;border:1px solid #dde0e6;border-radius:14px;padding:18px 22px;margin-bottom:16px;box-shadow:0 1px 4px rgba(0,0,0,.05)}
h3.sec{margin:0 0 16px;font-size:17px;font-weight:800;color:#1c2330;padding-bottom:10px;border-bottom:2px solid #eceef2;letter-spacing:-.2px}

/* ── Governance nodes ── */
.gn{background:#f5f7fa;border:1px solid #d3d8e2;border-radius:10px;padding:11px 15px;font-size:13.5px;line-height:1.5}
.gn b{display:block;font-size:14.5px;font-weight:700;margin-bottom:3px;color:#111827}
.gov .note{font-size:12.5px;color:#5b6472;margin-top:12px;line-height:1.6;border-top:1px solid #eceef2;padding-top:10px}

/* ── Arrows ── */
.arw{text-align:center;color:#9ba3b0;margin:8px 0;font-size:20px;line-height:1}

/* ── Two-column Hub/ML layout ── */
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.sub2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media(max-width:700px){.two,.sub2{grid-template-columns:1fr}}
.col{border-radius:12px;padding:14px 16px;border:2px solid;display:flex;flex-direction:column;gap:8px}
.hubc{background:#f5f3ff;border-color:#a78bfa}
.mlc{background:#f0fdfa;border-color:#2dd4bf}
.col .gn{background:#fff}
.tier{display:flex;justify-content:center}
.tier .gn{flex:0 1 520px;text-align:center}

/* ── Main layout ── */
.layout{display:grid;grid-template-columns:1fr 252px;gap:14px;align-items:start}
@media(max-width:1050px){.layout{grid-template-columns:1fr}}

/* ── Legend ── */
.legend{font-size:13px;color:#5b6472;margin:4px 0 12px;line-height:1.6}

/* ── Quarterly grid ── */
.qs{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media(max-width:960px){.qs{grid-template-columns:repeat(2,1fr)}}
@media(max-width:580px){.qs{grid-template-columns:1fr}}
.q{background:#fff;border:1px solid #dde0e6;border-top-width:3px;border-radius:14px;padding:16px;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.qs>section:nth-child(1){border-top-color:#1f3a8a}
.qs>section:nth-child(2){border-top-color:#0d9488}
.qs>section:nth-child(3){border-top-color:#7c3aed}
.qs>section:nth-child(4){border-top-color:#e4572e}
.q header b{font-size:15px;font-weight:800;display:block;margin-bottom:1px;letter-spacing:-.2px}
.gates{font-size:11.5px;color:#5b6472;margin:2px 0 10px;line-height:1.5}
.host{display:flex;align-items:center;gap:8px;padding:7px 9px;border:2px dashed #b8bec9;border-radius:9px;margin-bottom:12px;font-size:12.5px;color:#4a5260;background:#fafbfc}
.chip{display:inline-block;padding:4px 12px;border-radius:999px;background:#1f3a8a;color:#fff;font-weight:700;font-size:12.5px;cursor:grab;touch-action:none;user-select:none;letter-spacing:.01em;box-shadow:0 1px 3px rgba(31,58,138,.35);white-space:nowrap}

/* ── Slot labels ── */
.lbl{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:#5b6472;font-weight:700;margin:11px 0 4px}

/* ── Drop slots ── */
.slot{min-height:50px;border:2px dashed #c0c7d4;border-radius:9px;padding:4px;display:flex;align-items:center;background:#f8f9fb;transition:border-color .15s,background .15s}
.slot .empty,.bt .empty{color:#9ba3b0;font-size:12px;padding:5px 7px}

/* ── Event blocks ── */
.blk{border:1px solid #d4d9e3;border-radius:9px;padding:7px 9px;margin-bottom:7px;background:#fff;cursor:grab;touch-action:none;user-select:none;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.blk .bh{display:flex;justify-content:space-between;align-items:baseline;font-size:12.5px;margin-bottom:5px}
.blk .ev{font-weight:800;font-size:12.5px}
.blk .bh b{color:#374151;font-size:12.5px;font-weight:700}
.blk.panel{border-left:4px solid #7a5af8}
.blk.meetup{border-left:4px solid #12a594}
.blk.workshop{border-left:4px solid #e08a00}

/* ── Topic cards ── */
.card{--c:#555;position:relative;background:color-mix(in srgb,var(--c) 10%,#fff);border:1.5px solid var(--c);border-left-width:4px;border-radius:7px;padding:5px 8px;font-size:12px;line-height:1.4;cursor:grab;touch-action:none;user-select:none;width:100%}
.card.prop{border-style:dashed;border-left-style:solid}
.card .cm{font-weight:800;color:var(--c);margin-right:5px}
.lifted{opacity:.3}
.ghost{position:fixed;z-index:99;pointer-events:none;width:230px;opacity:.92;box-shadow:0 8px 24px rgba(0,0,0,.22)}
.over{outline:3px solid #1f3a8a;outline-offset:2px;background:#eef2ff!important}

/* ── Pool sidebar ── */
.pool{background:#fff;border:1px solid #dde0e6;border-radius:14px;position:sticky;top:8px;max-height:96vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.pool-head{padding:16px 16px 0;flex-shrink:0}
.pool h3{margin:0 0 2px;font-size:15px;font-weight:800}
.pool>.pool-head>.sub{margin-bottom:12px;font-size:12.5px}
.pool-topics{overflow-y:auto;flex:1;min-height:0;padding:4px 16px 16px}
.stack{margin-bottom:14px;border-left:4px solid var(--c);padding-left:9px}
.stack h4{margin:0 0 7px;font-size:12.5px;font-weight:700;color:var(--c);letter-spacing:.01em}
.stack .card{margin-bottom:5px}
.none{font-size:13px;color:#9ba3b0}

/* ── Bottom panels ── */
.panel2{background:#fff;border:1px solid #dde0e6;border-radius:14px;padding:16px 20px;margin-top:12px;font-size:14px;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.panel2 h3{margin:0 0 10px;font-size:15px;font-weight:800}
.flag{color:#a4400f}.ok{color:#176b3a}
ul{margin:6px 0 0 20px;padding:0;line-height:1.65}
.det .src{font-size:13px;color:#5b6472}

/* ── Toast ── */
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1c2330;color:#fff;padding:10px 20px;border-radius:10px;font-size:14px;display:none;z-index:100;box-shadow:0 4px 20px rgba(0,0,0,.22)}
body.dragging{cursor:grabbing}

/* ── Strategy cascade ── */
.cs{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;align-items:stretch}
@media(max-width:900px){.cs{grid-template-columns:1fr}}
.cl{background:#eef2ff;border:1px solid #c7d2fe;border-radius:10px;padding:11px 13px;font-size:13.5px;line-height:1.5}
.cl b{display:block;font-size:14px;font-weight:700;margin-bottom:4px;color:#1e3a8a}
.cl.sup{margin-top:8px;background:#f5f7fa;border-color:#d3d8e2}
.cl.sup b{color:#374151}

/* ── Table ── */
table.pt{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:10px}
.pt th,.pt td{border-bottom:1px solid #e3e6ec;padding:7px 9px;text-align:left;vertical-align:top}
.pt th{font-weight:700;color:#1c2330;background:#f5f7fa;font-size:12.5px;text-transform:uppercase;letter-spacing:.04em}
.pt select{font:inherit;font-size:13px;padding:3px 6px;border:1px solid #c5cad3;border-radius:5px}

/* ── Forms ── */
.frm{display:grid;gap:6px;margin-top:8px}
.frm input,.frm select{font:inherit;font-size:13.5px;padding:7px 9px;border:1px solid #c5cad3;border-radius:8px;width:100%}
.frm button{font-size:13px;padding:7px 10px}

/* ── Details / open points ── */
.dotted{margin:12px auto;max-width:640px;border:2px dotted #9ba3b0;border-radius:12px;padding:10px 14px;background:#fbfbfd}
.dotted summary,#opd summary{cursor:pointer;font-size:14px;font-weight:700}
.rm{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
@media(max-width:700px){.rm{grid-template-columns:1fr}}
.rm .col b{display:block;font-size:14px;font-weight:700;margin-bottom:4px}
.rm .col div{font-size:13.5px}
</style>
</head>

  }

function canDrop(d,el){
  const k=el.dataset.drop;
  if(d.kind==='topic'){
    const t=byId[d.id];
    if(k==='pool')return true;
    if(k==='slot-c')return t.f==='c';
    if(k==='slot-w')return t.f==='w';
    if(k==='blk')return t.f==='e';
    return false;
  }
  if(d.kind==='host')return k==='host'&&+el.dataset.q!==d.q;
  if(d.kind==='blk')return k==='blk'&&+el.dataset.q===d.q&&el.dataset.role!==d.role;
  return false;
}
function reroll(q){const r=roles(S.host[q]);for(const k of ROLES)S.ev[q][k].city=r[k];}
function doDrop(d,el){
  const q=+el.dataset.q,k=el.dataset.drop;
  if(d.kind==='topic'){
    unplace(d.id);
    if(k==='slot-c')S.cyc[q]=d.id;
    else if(k==='slot-w')S.wg[q]=d.id;
    else if(k==='blk')S.ev[q][el.dataset.role].topic=d.id;
  }else if(d.kind==='host'){
    [S.host[d.q],S.host[q]]=[S.host[q],S.host[d.q]];
    reroll(d.q);reroll(q);
    const m=i=>LANG==='hr'?QM[i].hr:QM[i].en;
    toast(tr('toastSwap',S.host[d.q],m(d.q),S.host[q],m(q)));
  }else if(d.kind==='blk'){
    const a=S.ev[q][d.role],b=S.ev[q][el.dataset.role];
    [a.city,b.city]=[b.city,a.city];
  }
  render();
}
let drag=null;
document.addEventListener('pointerdown',e=>{
  const el=e.target.closest('[data-drag]');if(!el)return;
  drag={el,d:JSON.parse(el.dataset.drag),sx:e.clientX,sy:e.clientY,moved:false,ghost:null};
});
window.addEventListener('pointermove',e=>{
  if(!drag)return;
  if(!drag.moved){
    if(Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy)<5)return;
    drag.moved=true;
    const g=drag.el.cloneNode(true);g.classList.add('ghost');g.removeAttribute('data-drag');g.removeAttribute('data-drop');
    document.body.appendChild(g);drag.ghost=g;drag.el.classList.add('lifted');document.body.classList.add('dragging');
  }
  drag.ghost.style.left=(e.clientX+8)+'px';drag.ghost.style.top=(e.clientY+8)+'px';
  document.querySelectorAll('.over').forEach(x=>x.classList.remove('over'));
  const t=document.elementFromPoint(e.clientX,e.clientY);
  const tg=t&&t.closest('[data-drop]');
  if(tg&&canDrop(drag.d,tg))tg.classList.add('over');
});
window.addEventListener('pointerup',e=>{
  if(!drag)return;
  const cur=drag;drag=null;
  document.querySelectorAll('.over').forEach(x=>x.classList.remove('over'));
  document.body.classList.remove('dragging');
  if(cur.ghost)cur.ghost.remove();
  cur.el.classList.remove('lifted');
  if(!cur.moved){
    if(cur.d.kind==='topic'){sel=cur.d.id;details();}
    return;
  }
  const t=document.elementFromPoint(e.clientX,e.clientY);
  const tg=t&&t.closest('[data-drop]');
  if(tg&&canDrop(cur.d,tg))doDrop(cur.d,tg);
  else if(tg&&cur.d.kind==='topic')toast(tr('toastMismatch'));
});
window.addEventListener('pointercancel',()=>{
  if(drag){if(drag.ghost)drag.ghost.remove();drag.el.classList.remove('lifted');document.body.classList.remove('dragging');drag=null;}
});

async function exportPdf(){
  if(!window.jspdf){toast(tr('pdfLib'));return;}
  const {jsPDF}=window.jspdf;
  const doc=new jsPDF({orientation:'landscape',unit:'mm',format:'a4'});
  const M=10,W=297-2*M,gap=3,cw=(W-3*gap)/4;
  const nm=id=>L(byId[id].n);
  doc.setFont('helvetica','bold');doc.setFontSize(15);doc.text(clean(tr('title')),M,M+5);
  doc.setFont('helvetica','normal');doc.setFontSize(8);doc.setTextColor(90);
  doc.text(clean(tr('pdfSub',new Date().toISOString().slice(0,10))),M,M+10);
  doc.setTextColor(30);doc.setFontSize(7.5);
  const gl=doc.splitTextToSize(clean(tr('pdfGov')),W);doc.text(gl,M,M+15);
  let top=M+15+gl.length*3.4+2;

    else{y+=drawBox(x,y,cw,[clean(tr('pdfEmpty'))],'#999999',true);}

  const blob=new Blob([doc.output('arraybuffer')],{type:'application/pdf'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download=LANG==='hr'?'carnet-hub-godisnji-plan-2027.pdf':'carnet-hub-annual-plan-2027.pdf';
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url),1000);
  toast(tr('pdfSaved'));
}
render();
</script>
